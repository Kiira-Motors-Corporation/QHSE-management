# The single public origin.
#
# The application and the API are served from one origin deliberately. The
# session cookie is HttpOnly and SameSite, and a split-origin arrangement would
# behave differently in development from production in precisely the area least
# forgiving of surprises.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application holds health data. Nothing here should be cached by an
    # intermediary, and the browser should not be guessing content types.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Everything is served from this origin. No CDN, no external font host, no
    # analytics — this system runs on premise and must work with no route off
    # the plant network.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker embedded DNS resolver with 5s cache so recreated backend containers are re-resolved immediately.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $gateway_upstream "http://gateway:8081";

    # Hashed assets are immutable; index.html never is, or a deploy would not
    # reach anyone still holding the old one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /auth/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths are application routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
